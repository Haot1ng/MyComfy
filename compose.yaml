# Linux 或 Docker Desktop WSL 2。core 的本机管理端口使用 host 网络；
# engine 和 worker 使用同一个私有容器网络命名空间，ComfyUI 仅绑定该空间内的回环地址。
x-app-environment: &app-environment
  MYCOMFY_DATABASE_URL: "${MYCOMFY_DATABASE_URL:-mysql+pymysql://mycomfy:${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}@127.0.0.1:${MYCOMFY_MYSQL_PORT:-3306}/mycomfy}"
  MYCOMFY_DATA_ROOT: "${MYCOMFY_DATA_ROOT:-/srv/mycomfy/data}"

# 保留宿主绝对路径，发布器与运行管理可以重读数据库中记录的文件位置。
x-data-mount: &data-mount
  type: bind
  source: "${MYCOMFY_DATA_ROOT:-/srv/mycomfy/data}"
  target: "${MYCOMFY_DATA_ROOT:-/srv/mycomfy/data}"
  bind:
    create_host_path: false

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mycomfy
      MYSQL_USER: mycomfy
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}"
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      - "127.0.0.1:${MYCOMFY_MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u mycomfy mycomfy -e "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--save", "", "--appendonly", "no"]
    environment:
      REDISCLI_AUTH: "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"
    ports:
      - "127.0.0.1:${MYCOMFY_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -qx PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: .
      target: worker
    command: ["migrate"]
    network_mode: host
    environment: *app-environment
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  core:
    build:
      context: .
      target: api
    image: mycomfy-core:local
    network_mode: host
    restart: unless-stopped
    init: true
    user: "${MYCOMFY_UID:-10001}:${MYCOMFY_GID:-10001}"
    command: ["api", "--host", "${MYCOMFY_API_HOST:-127.0.0.1}", "--port", "${MYCOMFY_API_PORT:-8000}", "--local-port", "${MYCOMFY_LOCAL_PORT:-8001}"]
    environment:
      <<: *app-environment
      MYCOMFY_PUBLIC_ORIGIN: "${MYCOMFY_PUBLIC_ORIGIN:-http://127.0.0.1:${MYCOMFY_API_PORT:-8000}}"
      MYCOMFY_COOKIE_SECURE: "${MYCOMFY_COOKIE_SECURE:-false}"
      MYCOMFY_REDIS_URL: "${MYCOMFY_REDIS_URL:-redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@127.0.0.1:${MYCOMFY_REDIS_PORT:-6379}/0}"
      MYCOMFY_MAINTENANCE_TOKEN_FILE: /run/mycomfy/maintenance-token
    volumes:
      - *data-mount
      - ${MYCOMFY_CONFIG_DIR:-./var/config}:/run/mycomfy:ro
      # 只有提供网页的进程挂载这两处静态资源。
      - ./web/client:/opt/mycomfy/mycomfy/web/client:ro
      - ./web/admin:/opt/mycomfy/mycomfy/web/admin:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', ${MYCOMFY_LOCAL_PORT:-8001}), 2).close()"]
      interval: 10s
      timeout: 3s
      retries: 6

  engine:
    build:
      context: .
      target: engine
    image: mycomfy-engine:local
    gpus: all
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    user: "${MYCOMFY_UID:-10001}:${MYCOMFY_GID:-10001}"
    environment:
      <<: *app-environment
      MYCOMFY_DATABASE_URL: &engine-db "${MYCOMFY_ENGINE_DATABASE_URL:-${MYCOMFY_DATABASE_URL:-mysql+pymysql://mycomfy:${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}@mysql:3306/mycomfy}}"
      # deploy 将检出、venv、模型与每个代次的工作目录写在同一个持久根目录。
      MYCOMFY_ENGINE_CONFIG: "${MYCOMFY_DATA_ROOT:-/srv/mycomfy/data}/engines/engines.json"
      HOME: "${MYCOMFY_DATA_ROOT:-/srv/mycomfy/data}/engines"
    volumes:
      - *data-mount
      - ${MYCOMFY_DEPLOYMENT_DIR:-./var/deployment}:/deployment:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "mycomfy.cli", "runtime", "ready"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: ${MYCOMFY_ENGINE_START_PERIOD:-5m}

  worker:
    build:
      context: .
      target: worker
    image: mycomfy-worker:local
    network_mode: service:engine
    init: true
    restart: unless-stopped
    user: "${MYCOMFY_UID:-10001}:${MYCOMFY_GID:-10001}"
    command: ["worker"]
    environment:
      <<: *app-environment
      MYCOMFY_DATABASE_URL: *engine-db
    volumes:
      - *data-mount
    depends_on:
      migrate:
        condition: service_completed_successfully
      # Worker 在引擎启动或恢复时就可以核对既有执行。
      engine:
        condition: service_started
        restart: true

volumes:
  mysql-data:
