# Linux 或 Docker Desktop WSL 2。gateway 承接宿主端口，core 使用私有 Unix 套接字；
# engine 和 worker 使用同一个私有容器网络命名空间，ComfyUI 仅绑定该空间内的回环地址。
x-app-environment: &app-environment
  # deploy.py 根据所选角色生成完整连接串。停机只操作已有容器，解析此文件时允许为空。
  MYCOMFY_DATABASE_URL: "${MYCOMFY_DATABASE_URL:-}"
  MYCOMFY_DATA_ROOT: "${MYCOMFY_DATA_ROOT:-/srv/mycomfy/data}"
  # 各机保存相同的工作台地址。仅业务端绑定监听端口，Worker 通过 MySQL 领任务。
  MYCOMFY_PUBLIC_ORIGIN: "${MYCOMFY_PUBLIC_ORIGIN:-http://127.0.0.1:${MYCOMFY_API_PORT:-8000}}"

# 保留宿主绝对路径，发布器与运行管理可以重读数据库中记录的文件位置。
x-data-mount: &data-mount
  type: bind
  source: "${MYCOMFY_DATA_ROOT:-/srv/mycomfy/data}"
  target: "${MYCOMFY_DATA_ROOT:-/srv/mycomfy/data}"
  bind:
    create_host_path: false

# 网关只需读写访问规则、状态和统计，和业务数据、数据库凭据、维护令牌分别挂载。
x-gateway-state: &gateway-state
  type: bind
  source: "${MYCOMFY_GATEWAY_STATE_DIR:-./var/gateway}"
  target: /var/lib/mycomfy-gateway
  bind:
    create_host_path: false

services:
  mysql:
    image: mysql:8.4
    profiles: [database]
    restart: unless-stopped
    command:
      - sh
      - -ec
      - |
        # 密码只在启动自带 MySQL 时要求，外部数据库可以使用独立的连接串。
        : "$${MYSQL_PASSWORD:?set MYSQL_PASSWORD before starting mysql}"
        # 官方镜像以专用变量设置 root 的密码；普通账号由 MYSQL_USER 创建。
        if [ "$$MYSQL_USER" = root ]; then
          export MYSQL_ROOT_PASSWORD="$$MYSQL_PASSWORD"
          unset MYSQL_RANDOM_ROOT_PASSWORD MYSQL_USER MYSQL_PASSWORD
        fi
        exec docker-entrypoint.sh mysqld
    environment:
      MYSQL_DATABASE: mycomfy
      MYSQL_USER: "${MYSQL_USER:-mycomfy}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-}"
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      - target: 3306
        published: "${MYCOMFY_MYSQL_PORT:-3306}"
        host_ip: "${MYCOMFY_MYSQL_BIND_HOST:-127.0.0.1}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 --user="$$MYSQL_USER" mycomfy -e "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    profiles: [database]
    restart: unless-stopped
    # 用密码摘要配置所选 ACL 用户。使用自定义用户时，关闭内置 default 账号。
    command:
      - sh
      - -ec
      - |
        : "$${REDISCLI_AUTH:?set REDIS_PASSWORD before starting redis}"
        digest="$$(printf '%s' "$$REDISCLI_AUTH" | sha256sum)"
        set -- --user "$$REDIS_USER" reset on "#$${digest%% *}" '~*' '&*' '+@all'
        if [ "$$REDIS_USER" != default ]; then
          set -- --user default off "$$@"
        fi
        exec docker-entrypoint.sh redis-server "$$@" --save '' --appendonly no
    environment:
      REDIS_USER: "${REDIS_USER:-default}"
      REDISCLI_AUTH: "${REDIS_PASSWORD:-}"
    ports:
      - target: 6379
        published: "${MYCOMFY_REDIS_PORT:-6379}"
        host_ip: "${MYCOMFY_REDIS_BIND_HOST:-127.0.0.1}"
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli --user "$$REDIS_USER" ping | grep -qx PONG']
      interval: 10s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: .
      target: worker
    command: ["migrate"]
    # 迁移与 Worker 共用镜像，一次性命令通过退出码报告结果。
    healthcheck:
      disable: true
    network_mode: host
    environment: *app-environment
    restart: "no"

  core:
    build:
      context: .
      target: api
    image: mycomfy-core:local
    network_mode: host
    restart: unless-stopped
    init: true
    user: "${MYCOMFY_UID:-10001}:${MYCOMFY_GID:-10001}"
    command: ["api", "--socket-dir", "/run/mycomfy-api"]
    environment:
      <<: *app-environment
      MYCOMFY_MANUAL_RETRY_LIMIT: "${MYCOMFY_MANUAL_RETRY_LIMIT:-3}"
      MYCOMFY_COOKIE_SECURE: "${MYCOMFY_COOKIE_SECURE:-false}"
      MYCOMFY_ADMIN_ORIGIN: "${MYCOMFY_ADMIN_ORIGIN:-}"
      MYCOMFY_REDIS_URL: "${MYCOMFY_REDIS_URL:-}"
      MYCOMFY_MAINTENANCE_TOKEN_FILE: /run/mycomfy/maintenance-token
      MYCOMFY_GATEWAY_DIR: /var/lib/mycomfy-gateway
    volumes:
      - *data-mount
      - *gateway-state
      - api-sockets:/run/mycomfy-api
      - ${MYCOMFY_CONFIG_DIR:-./var/config}:/run/mycomfy:ro
      # 只有提供网页的进程挂载这两处静态资源。
      - ./web/client:/opt/mycomfy/mycomfy/web/client:ro
      - ./web/admin:/opt/mycomfy/mycomfy/web/admin:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client,socket; c=http.client.HTTPConnection('localhost',timeout=2); s=socket.socket(socket.AF_UNIX); s.settimeout(2); s.connect('/run/mycomfy-api/admin.sock'); c.sock=s; c.request('HEAD','/'); assert c.getresponse().status == 200"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  gateway:
    build:
      context: .
      target: gateway
    image: mycomfy-gateway:local
    network_mode: host
    restart: unless-stopped
    init: true
    user: "${MYCOMFY_UID:-10001}:${MYCOMFY_GID:-10001}"
    environment:
      MYCOMFY_API_HOST: "${MYCOMFY_API_HOST:-127.0.0.1}"
      MYCOMFY_API_PORT: "${MYCOMFY_API_PORT:-8000}"
      MYCOMFY_LOCAL_PORT: "${MYCOMFY_LOCAL_PORT:-8001}"
      MYCOMFY_GATEWAY_DIR: /var/lib/mycomfy-gateway
      MYCOMFY_TRUSTED_PROXY_CIDRS: "${MYCOMFY_TRUSTED_PROXY_CIDRS:-}"
    volumes:
      - *gateway-state
      - api-sockets:/run/mycomfy-api:ro
    depends_on:
      core:
        condition: service_healthy

  engine:
    build:
      context: .
      target: engine
    image: mycomfy-engine:local
    gpus: all
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    user: "${MYCOMFY_UID:-10001}:${MYCOMFY_GID:-10001}"
    environment:
      <<: *app-environment
      MYCOMFY_DATABASE_URL: &engine-db "${MYCOMFY_ENGINE_DATABASE_URL:-}"
      # deploy 将检出、venv、模型与每个代次的工作目录写在同一个持久根目录。
      MYCOMFY_ENGINE_CONFIG: "${MYCOMFY_DATA_ROOT:-/srv/mycomfy/data}/engines/engines.json"
      HOME: "${MYCOMFY_DATA_ROOT:-/srv/mycomfy/data}/engines"
    volumes:
      - *data-mount
      - ${MYCOMFY_DEPLOYMENT_DIR:-./var/deployment}:/deployment:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "mycomfy.cli", "runtime", "ready"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: ${MYCOMFY_ENGINE_START_PERIOD:-5m}

  worker:
    build:
      context: .
      target: worker
    image: mycomfy-worker:local
    network_mode: service:engine
    init: true
    restart: unless-stopped
    user: "${MYCOMFY_UID:-10001}:${MYCOMFY_GID:-10001}"
    command: ["worker"]
    environment:
      <<: *app-environment
      MYCOMFY_DATABASE_URL: *engine-db
    volumes:
      - *data-mount
    depends_on:
      migrate:
        condition: service_completed_successfully
      # Worker 在引擎启动或恢复时就可以核对既有执行。
      engine:
        condition: service_started
        restart: true

volumes:
  mysql-data:
  api-sockets:
