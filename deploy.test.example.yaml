# 临时外网测试专用设置。默认直接使用本示例，首次成功建立两个入口后会在同目录的 deploy.test.yaml 记录设备名和端口。
# 如需提前指定设备或端口，可自行复制本文件为 deploy.test.yaml 后编辑。
# 业务数据库、模型和本机网关端口由 deploy.config.yaml 提供。

# auto 从当前已登录的 Tailscale 设备读取完整 DNS 名称。要固定设备，可填写实际名称，
# 例如 "workstation.example-tailnet.ts.net"；启动时会与本机身份核对，大小写和 DNS 末尾的点不影响匹配。
machine_name: auto

# 工作台对外的 HTTPS 端口，填整数 443、8443 或 10000。443 使用 https://设备名，其余端口需出现在浏览器地址中。
public_https_port: 443

# 管理后台对外的 HTTPS 端口，同样可填 443、8443 或 10000，须与工作台端口不同。
# 使用这里的默认值时，访问地址为 https://设备名:8443。两个本地转发目标由业务配置的 ports.api 和 ports.admin 决定。
admin_https_port: 8443
