[project]
name = "mycomfy"
version = "0.1.0"
description = "Local video generation API and worker"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "argon2-cffi>=23.1,<26",
    "cryptography>=46,<51",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
    "pymysql[rsa]>=1.1,<2",
    "python-multipart>=0.0.22,<1",
    "redis>=6.2,<8",
    "referencing>=0.36,<1",
    "sqlalchemy>=2.0.39,<2.1",
    "uvicorn>=0.34,<1",
    "websockets>=15,<17",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
mycomfy = "mycomfy.cli:main"

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "mycomfy/migrations"
"web/client" = "mycomfy/web/client"
"web/admin" = "mycomfy/web/admin"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["mysql: requires a dedicated MySQL test database"]

[tool.ruff]
line-length = 100
